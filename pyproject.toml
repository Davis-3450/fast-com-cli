[project]
name = "fast-com-cli"
version = "0.1.0"
description = "Internet speed test powered by fast.com"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
fastcom = "fast_com_cli:app"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
